name: zorn-ipados17
on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300
    env:
      DEVICE: ${{ github.workspace }}/UniXNU-zorn
      PROFILE: ipados-17.7.11-21H461
      CONFIG_NAME: zorn_union_defconfig
    steps:
      - name: runner info
        run: |
          sw_vers
          xcodebuild -version
          df -h /

      - name: checkout this repo (for ci/prep.sh)
        uses: actions/checkout@v4
        with:
          path: .

      - name: checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 630b85a307f19c8d8a4699d5bfc12f6796b874aa
          path: UniXNU

      - name: checkout device repos
        run: |
          git clone --depth 1 https://github.com/kerrinz/UniXNU-zorn.git UniXNU-zorn
          git clone --depth 1 https://github.com/kerrinz/uefi-zorn.git uefi-zorn
          cp UniXNU-zorn/board.toml board.orig.toml

      - name: install device OS profile into upstream
        run: |
          mkdir -p UniXNU/profiles/os
          cp -r UniXNU-zorn/profiles/os/. UniXNU/profiles/os/

      - name: adapt config switches
        run: |
          CFG=UniXNU-zorn/configs/zorn_union_defconfig
          sed -i '' -E 's/^CONFIG_XNU_OWNER_/# &/; s/^CONFIG_XNU_ZORN_VERIFIED_ROOT=/# &/; s/^CONFIG_XNU_VERIFIED_ROOT_/# &/; s/^CONFIG_XNU_TRUST_CACHE_RUNTIME=/# &/' "$CFG"
          bash ci/prep.sh "$DEVICE" lean

      - name: defconfig + fetch
        run: |
          cd UniXNU
          ./unixnu defconfig "$CONFIG_NAME" -D "$DEVICE" --os "$PROFILE"
          ./unixnu fetch -D "$DEVICE" --os "$PROFILE" 2>&1 | tail -5

      - name: fetch IPSW kernelcache (21H461)
        run: |
          cd UniXNU
          KC=$(./unixnu ipsw fetch KernelCache -D "$DEVICE" --os "$PROFILE" | tail -1)
          echo "KC=$KC"; ls -l "$KC"
          echo "$KC" > "$GITHUB_WORKSPACE/kc.txt"

      - name: attempt 1 (bootstrap; expected to stop at availability.pl)
        run: |
          cd UniXNU
          KC=$(cat "$GITHUB_WORKSPACE/kc.txt")
          ./unixnu build kernel -D "$DEVICE" --os "$PROFILE" --kernelcache "$KC" > "$GITHUB_WORKSPACE/k1.log" 2>&1 || true
          tail -8 "$GITHUB_WORKSPACE/k1.log" || true

      - name: patch availability.pl into both SDKs
        run: |
          PL=$(find UniXNU/out -path '*fakeroot/usr/local/libexec/availability.pl' | head -1)
          echo "PL=$PL"
          for sdk in "$(xcrun --sdk macosx --show-sdk-path)" "$(xcrun --sdk iphoneos --show-sdk-path)"; do
            if [ -n "$PL" ]; then
              sudo mkdir -p "$sdk/usr/local/libexec"
              sudo cp "$PL" "$sdk/usr/local/libexec/availability.pl"
              sudo chmod 755 "$sdk/usr/local/libexec/availability.pl"
            fi
          done

      - name: attempt 2 (lean archives -> link -> kernel.macho)
        run: |
          cd UniXNU
          KC=$(cat "$GITHUB_WORKSPACE/kc.txt")
          ./unixnu build kernel -D "$DEVICE" --os "$PROFILE" --kernelcache "$KC" > "$GITHUB_WORKSPACE/k2.log" 2>&1 || true
          tail -20 "$GITHUB_WORKSPACE/k2.log" || true
          echo "=== kernel dir ==="
          ls -l UniXNU/out/zorn/*/*/kernel/ 2>/dev/null || true

      - name: attempt 3 (full archives with kernel.macho present)
        run: |
          cp board.orig.toml UniXNU-zorn/board.toml
          bash ci/prep.sh "$DEVICE" full
          cd UniXNU
          KC=$(cat "$GITHUB_WORKSPACE/kc.txt")
          ./unixnu build kernel -D "$DEVICE" --os "$PROFILE" --kernelcache "$KC" > "$GITHUB_WORKSPACE/k3.log" 2>&1 || true
          tail -25 "$GITHUB_WORKSPACE/k3.log" || true
          echo "=== macho ==="
          find UniXNU/out -name '*.macho' -exec ls -l {} \; 2>/dev/null | head -10 || true

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorn-ipados17-logs
          path: |
            k1.log
            k2.log
            k3.log
            kc.txt
            UniXNU/out/zorn/**/logs/**
            UniXNU/out/zorn/**/kernel/*.macho
          if-no-files-found: warn
