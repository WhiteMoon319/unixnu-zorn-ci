name: zorn-kernel
on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: runner info
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          xcrun --sdk iphoneos --show-sdk-path || true
          df -h /

      - name: checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 630b85a307f19c8d8a4699d5bfc12f6796b874aa
          path: UniXNU

      - name: checkout device repos
        run: |
          git clone --depth 1 https://github.com/kerrinz/UniXNU-zorn.git UniXNU-zorn
          git clone --depth 1 https://github.com/kerrinz/uefi-zorn.git uefi-zorn
          ls

      - name: unixnu fetch
        run: |
          cd UniXNU
          ./unixnu fetch -D "$GITHUB_WORKSPACE/UniXNU-zorn" 2>&1 | tail -40 || true

      - name: unixnu status
        run: |
          cd UniXNU
          ./unixnu status -D "$GITHUB_WORKSPACE/UniXNU-zorn" --os ios-26.6.2-23G90 --json > "$GITHUB_WORKSPACE/status.json" 2> "$GITHUB_WORKSPACE/status.err" || true
          head -c 3000 "$GITHUB_WORKSPACE/status.json" || true
          tail -20 "$GITHUB_WORKSPACE/status.err" || true

      - name: kernel build attempt
        run: |
          cd UniXNU
          ./unixnu build kernel -D "$GITHUB_WORKSPACE/UniXNU-zorn" --os ios-26.6.2-23G90 > "$GITHUB_WORKSPACE/kernel.log" 2>&1 || true
          tail -60 "$GITHUB_WORKSPACE/kernel.log" || true

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorn-logs
          path: |
            status.json
            status.err
            kernel.log
          if-no-files-found: warn
