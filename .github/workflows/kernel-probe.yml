name: zorn-kernel
on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: runner info
        run: |
          sw_vers
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 630b85a307f19c8d8a4699d5bfc12f6796b874aa
          path: UniXNU

      - name: checkout device repos
        run: |
          git clone --depth 1 https://github.com/kerrinz/UniXNU-zorn.git UniXNU-zorn
          git clone --depth 1 https://github.com/kerrinz/uefi-zorn.git uefi-zorn
          ls UniXNU-zorn/profiles/os

      - name: install device OS profile into upstream
        run: |
          mkdir -p UniXNU/profiles/os
          cp -r UniXNU-zorn/profiles/os/. UniXNU/profiles/os/
          ls UniXNU/profiles/os

      - name: unixnu fetch
        run: |
          cd UniXNU
          ./unixnu fetch -D "$GITHUB_WORKSPACE/UniXNU-zorn" 2>&1 | tail -20

      - name: unixnu status
        run: |
          cd UniXNU
          ./unixnu status -D "$GITHUB_WORKSPACE/UniXNU-zorn" --os ios-26.6.2-23G90 --json > "$GITHUB_WORKSPACE/status.json"
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ['GITHUB_WORKSPACE'] + '/status.json'))
          print('configured:', d.get('configured'), '| config:', d.get('configuration'))
          print('patch_order:', len(d.get('patch_order', [])))
          b = d.get('board', {})
          print('board keys:', sorted(b.keys())[:12])
          print('kernel:', b.get('kernel'))
          PY

      - name: kernel build attempt
        run: |
          cd UniXNU
          ./unixnu build kernel -D "$GITHUB_WORKSPACE/UniXNU-zorn" --os ios-26.6.2-23G90 > "$GITHUB_WORKSPACE/kernel.log" 2>&1 || true
          tail -80 "$GITHUB_WORKSPACE/kernel.log" || true
          echo "=== built artifacts ==="
          find "$GITHUB_WORKSPACE/UniXNU/out" -name '*.macho' -o -name 'mach.*' 2>/dev/null | head -20 || true

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorn-logs
          path: |
            status.json
            kernel.log
          if-no-files-found: warn
