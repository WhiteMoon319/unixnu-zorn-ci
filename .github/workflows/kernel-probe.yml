name: zorn-kernel
on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      DEVICE: ${{ github.workspace }}/UniXNU-zorn
      PROFILE: ios-26.6.2-23G90
      CONFIG: zorn_ios26
    steps:
      - name: runner info
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 630b85a307f19c8d8a4699d5bfc12f6796b874aa
          path: UniXNU

      - name: checkout device repos
        run: |
          git clone --depth 1 https://github.com/kerrinz/UniXNU-zorn.git UniXNU-zorn
          git clone --depth 1 https://github.com/kerrinz/uefi-zorn.git uefi-zorn

      - name: install device OS profile into upstream
        run: |
          mkdir -p UniXNU/profiles/os
          cp -r UniXNU-zorn/profiles/os/. UniXNU/profiles/os/

      - name: defconfig + fetch
        run: |
          cd UniXNU
          ./unixnu defconfig zorn_ios26_defconfig -D "$DEVICE" --os "$PROFILE"
          ./unixnu fetch -D "$DEVICE" --os "$PROFILE" 2>&1 | tail -10

      - name: "kernel attempt 1 (expected availability.pl missing from SDK)"
        run: |
          cd UniXNU
          ./unixnu build kernel -D "$DEVICE" --os "$PROFILE" > "$GITHUB_WORKSPACE/k1.log" 2>&1 || true
          tail -15 "$GITHUB_WORKSPACE/k1.log" || true

      - name: patch SDK with the generated availability.pl
        run: |
          PL=$(find UniXNU/out -path '*fakeroot/usr/local/libexec/availability.pl' | head -1)
          echo "PL=$PL"
          for sdk in "$(xcrun --sdk macosx --show-sdk-path)" "$(xcrun --sdk iphoneos --show-sdk-path)"; do
            echo "SDK=$sdk"
            if [ -n "$PL" ]; then
              sudo mkdir -p "$sdk/usr/local/libexec"
              sudo cp "$PL" "$sdk/usr/local/libexec/availability.pl"
              sudo chmod 755 "$sdk/usr/local/libexec/availability.pl"
              ls -l "$sdk/usr/local/libexec/" || true
            fi
          done

      - name: kernel attempt 2
        run: |
          cd UniXNU
          ./unixnu build kernel -D "$DEVICE" --os "$PROFILE" > "$GITHUB_WORKSPACE/k2.log" 2>&1 || true
          tail -40 "$GITHUB_WORKSPACE/k2.log" || true
          echo "=== macho ==="
          find UniXNU/out -name '*.macho' -o -name 'mach.*' 2>/dev/null | head -10 || true

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorn-logs
          path: |
            k1.log
            k2.log
            UniXNU/out/zorn/**/logs/**
          if-no-files-found: warn
