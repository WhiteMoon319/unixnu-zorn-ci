name: zorn-kernel
on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      DEVICE: ${{ github.workspace }}/UniXNU-zorn
    steps:
      - name: runner info
        run: |
          sw_vers
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 630b85a307f19c8d8a4699d5bfc12f6796b874aa
          path: UniXNU

      - name: checkout device repos
        run: |
          git clone --depth 1 https://github.com/kerrinz/UniXNU-zorn.git UniXNU-zorn
          git clone --depth 1 https://github.com/kerrinz/uefi-zorn.git uefi-zorn
          ls UniXNU-zorn/configs

      - name: install device OS profile into upstream
        run: |
          mkdir -p UniXNU/profiles/os
          cp -r UniXNU-zorn/profiles/os/. UniXNU/profiles/os/
          ls UniXNU/profiles/os

      - name: unixnu defconfig
        run: |
          cd UniXNU
          ./unixnu defconfig zorn_ios26_defconfig -D "$DEVICE" --os ios-26.6.2-23G90 2>&1 | tail -20

      - name: unixnu fetch
        run: |
          cd UniXNU
          ./unixnu fetch -D "$DEVICE" --os ios-26.6.2-23G90 2>&1 | tail -20

      - name: unixnu status
        run: |
          cd UniXNU
          ./unixnu status -D "$DEVICE" --os ios-26.6.2-23G90 --json > "$GITHUB_WORKSPACE/status.json" || true
          python3 - "$GITHUB_WORKSPACE/status.json" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print('status parse failed:', e); raise SystemExit(0)
          print('configured:', d.get('configured'), '| config:', d.get('configuration'))
          print('patch_order:', len(d.get('patch_order', [])))
          b = d.get('board', {})
          print('board keys:', sorted(b.keys()))
          print('kernel:', b.get('kernel'))
          print('prelink:', b.get('kernel', {}).get('prelink') if isinstance(b.get('kernel'), dict) else None)
          PY

      - name: kernel build attempt
        run: |
          cd UniXNU
          ./unixnu build kernel -D "$DEVICE" --os ios-26.6.2-23G90 > "$GITHUB_WORKSPACE/kernel.log" 2>&1 || true
          tail -40 "$GITHUB_WORKSPACE/kernel.log" || true
          for f in UniXNU/out/zorn/*/*/logs/*.log; do
            [ -f "$f" ] || continue
            echo "===== $f (tail 60) ====="
            tail -60 "$f"
          done
          echo "=== logs dir ==="
          ls -R "$GITHUB_WORKSPACE/UniXNU/out" 2>/dev/null | head -40 || true
          echo "=== macho ==="
          find "$GITHUB_WORKSPACE/UniXNU/out" -name '*.macho' 2>/dev/null | head -20 || true

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorn-logs
          path: |
            status.json
            kernel.log
          if-no-files-found: warn
